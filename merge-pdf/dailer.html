<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Calculator with Settings</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --btn-bg: #334155;
            --btn-hover: #475569;
            --btn-text: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --op-color: #f59e0b;
            --equals-color: #10b981;
            --border-color: #334155;
            --display-bg: #090d16;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --btn-bg: #e2e8f0;
            --btn-hover: #cbd5e1;
            --btn-text: #0f172a;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --op-color: #d97706;
            --equals-color: #059669;
            --border-color: #cbd5e1;
            --display-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background 0.2s, color 0.2s, transform 0.1s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .icon-btn:hover {
            background: var(--btn-hover);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            background: var(--display-bg);
            padding: 6px;
            margin: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--accent-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* Screen Sections */
        .section {
            display: none;
            padding: 0 20px 20px 20px;
            flex-direction: column;
        }

        .section.active {
            display: flex;
        }

        /* Display Box */
        .display-box {
            background: var(--display-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: right;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .history-view {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 5px;
            min-height: 20px;
            word-break: break-all;
        }

        .main-input {
            font-size: 32px;
            font-weight: 700;
            background: transparent;
            border: none;
            color: var(--text-color);
            text-align: right;
            width: 100%;
            outline: none;
        }

        /* Keypad Layout */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            padding: 16px 0;
            border: none;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: 18px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover {
            background: var(--btn-hover);
            transform: scale(0.98);
        }

        .btn.op {
            color: var(--op-color);
            background: rgba(245, 158, 11, 0.1);
        }

        .btn.op:hover {
            background: rgba(245, 158, 11, 0.2);
        }

        .btn.action {
            color: var(--accent-color);
            background: rgba(59, 130, 246, 0.1);
        }

        .btn.action:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .btn.equals {
            background: var(--equals-color);
            color: white;
        }

        .btn.equals:hover {
            background: #047857;
        }

        /* Settings Panel Styles */
        .settings-group {
            margin-bottom: 20px;
        }

        .settings-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--display-bg);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .settings-item span {
            font-size: 15px;
            font-weight: 500;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--btn-bg);
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        select.settings-select {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        /* History List UI */
        .history-container {
            max-height: 300px;
            overflow-y: auto;
        }

        .history-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .clear-hist-btn {
            width: 100%;
            padding: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1>Calculator Pro</h1>
            <button class="icon-btn" onclick="switchTab('settings')" title="Settings">⚙️</button>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs" id="mainNavTabs">
            <button class="tab-btn active" onclick="switchTab('calc')">Calculator</button>
            <button class="tab-btn" onclick="switchTab('history')">History</button>
            <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
        </div>

        <!-- 1. CALCULATOR SCREEN -->
        <div id="calc-section" class="section active">
            <div class="display-box">
                <div class="history-view" id="histView"></div>
                <input type="text" class="main-input" id="display" readonly value="0">
            </div>

            <div class="keypad">
                <button class="btn action" onclick="clearAll()">AC</button>
                <button class="btn action" onclick="backspace()">⌫</button>
                <button class="btn action" onclick="appendChar('%')">%</button>
                <button class="btn op" onclick="appendChar('/')">÷</button>

                <button class="btn" onclick="appendChar('7')">7</button>
                <button class="btn" onclick="appendChar('8')">8</button>
                <button class="btn" onclick="appendChar('9')">9</button>
                <button class="btn op" onclick="appendChar('*')">×</button>

                <button class="btn" onclick="appendChar('4')">4</button>
                <button class="btn" onclick="appendChar('5')">5</button>
                <button class="btn" onclick="appendChar('6')">6</button>
                <button class="btn op" onclick="appendChar('-')">-</button>

                <button class="btn" onclick="appendChar('1')">1</button>
                <button class="btn" onclick="appendChar('2')">2</button>
                <button class="btn" onclick="appendChar('3')">3</button>
                <button class="btn op" onclick="appendChar('+')">+</button>

                <button class="btn" onclick="toggleSign()">±</button>
                <button class="btn" onclick="appendChar('0')">0</button>
                <button class="btn" onclick="appendChar('.')">.</button>
                <button class="btn equals" onclick="calculate()">=</button>
            </div>
        </div>

        <!-- 2. HISTORY SCREEN -->
        <div id="history-section" class="section">
            <h3 style="margin-bottom: 12px; font-size: 16px;">Calculation History</h3>
            <div class="history-container" id="historyListContainer">
                <p style="color: var(--text-muted); text-align: center; margin-top: 40px;">No history available.</p>
            </div>
            <button class="clear-hist-btn" onclick="clearHistoryData()">Clear History</button>
        </div>

        <!-- 3. SETTINGS SCREEN -->
        <div id="settings-section" class="section">
            <h3 style="margin-bottom: 15px; font-size: 16px;">App Settings</h3>
            
            <div class="settings-item">
                <span>Dark Mode</span>
                <label class="switch">
                    <input type="checkbox" id="themeToggleCheckbox" checked onchange="toggleAppTheme()">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="settings-item">
                <span>Vibration Feedback</span>
                <label class="switch">
                    <input type="checkbox" id="vibeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="settings-item">
                <span>Decimal Precision</span>
                <select class="settings-select" id="precisionSelect">
                    <option value="2">2 Digits</option>
                    <option value="4" selected>4 Digits</option>
                    <option value="6">6 Digits</option>
                </select>
            </div>

            <div class="settings-item" style="margin-top: 15px; flex-direction: column; align-items: flex-start; gap: 8px;">
                <span style="font-size: 14px; color: var(--text-muted);">App Info</span>
                <p style="font-size: 13px;">Version: 2.0.0 Pro<br>Designed for smooth calculations.</p>
            </div>
        </div>
    </div>

    <script>
        // Tab Management
        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));

            if (tabName === 'calc') {
                document.getElementById('calc-section').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else if (tabName === 'history') {
                document.getElementById('history-section').classList.add('active');
                document.querySelectorAll('.tab-btn'][1].classList.add('active');
                renderHistoryUI();
            } else if (tabName === 'settings') {
                document.getElementById('settings-section').classList.add('active');
                document.querySelectorAll('.tab-btn'][2].classList.add('active');
            }
        }

        // Theme Toggle
        function toggleAppTheme() {
            const body = document.body;
            const isChecked = document.getElementById('themeToggleCheckbox').checked;
            if (isChecked) {
                body.setAttribute('data-theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
            }
        }

        // Calculator Core Functions
        let display = document.getElementById('display');
        let histView = document.getElementById('histView');
        let historyArray = JSON.parse(localStorage.getItem('calc_history')) || [];

        function triggerVibe() {
            if (document.getElementById('vibeToggle').checked && navigator.vibrate) {
                navigator.vibrate(20);
            }
        }

        function appendChar(char) {
            triggerVibe();
            if (display.value === '0' && char !== '.') {
                display.value = char;
            } else {
                display.value += char;
            }
        }

        function clearAll() {
            triggerVibe();
            display.value = '0';
            histView.innerText = '';
        }

        function backspace() {
            triggerVibe();
            if (display.value.length === 1 || display.value === 'Error') {
                display.value = '0';
            } else {
                display.value = display.value.slice(0, -1);
            }
        }

        function toggleSign() {
            triggerVibe();
            if (display.value !== '0' && display.value !== 'Error') {
                if (display.value.startsWith('-')) {
                    display.value = display.value.substring(1);
                } else {
                    display.value = '-' + display.value;
                }
            }
        }

        function calculate() {
            triggerVibe();
            let expr = display.value;
            if (!expr) return;

            histView.innerText = expr + " =";
            try {
                let cleanExpr = expr.replace(/×/g, '*').replace(/÷/g, '/');
                let result = eval(cleanExpr);

                let precision = parseInt(document.getElementById('precisionSelect').value) || 4;
                if (typeof result === 'number' && !isNaN(result)) {
                    result = parseFloat(result.toFixed(precision));
                }

                display.value = result;

                // Save to History
                historyArray.unshift({ expression: expr, result: result });
                if (historyArray.length > 20) historyArray.pop();
                localStorage.setItem('calc_history', JSON.stringify(historyArray));
            } catch (e) {
                display.value = 'Error';
            }
        }

        function renderHistoryUI() {
            let container = document.getElementById('historyListContainer');
            if (historyArray.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">No history available.</p>';
                return;
            }

            container.innerHTML = '';
            historyArray.forEach(item => {
                container.innerHTML += `
                    <div class="history-row">
                        <span style="color: var(--text-muted);">${item.expression}</span>
                        <strong style="color: var(--text-color);">= ${item.result}</strong>
                    </div>
                `;
            });
        }

        function clearHistoryData() {
            historyArray = [];
            localStorage.removeItem('calc_history');
            renderHistoryUI();
        }
    </script>
</body>
</html>
