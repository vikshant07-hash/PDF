<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truecaller Style Web Dialer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .phone-frame {
            width: 100%;
            max-width: 380px;
            height: 680px;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* App Header / Tabs */
        .tabs {
            display: flex;
            background: #0f4c81;
            color: white;
        }
        .tab {
            flex: 1;
            padding: 15px 0;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
        }
        .tab.active {
            border-bottom: 3px solid #ffcc00;
            background: #0b3960;
        }

        /* Screens Container */
        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }
        .screen.active {
            display: flex;
        }

        /* 1. Dialer Screen Styles */
        #display {
            width: 100%;
            height: 55px;
            font-size: 28px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: #f9f9f9;
            outline: none;
            letter-spacing: 2px;
            color: #333;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .key-btn {
            background-color: #f1f3f5;
            border: none;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            transition: background 0.2s;
        }
        .key-btn:active {
            background-color: #d1d5db;
        }
        .dialer-actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .call-btn { background-color: #28a745; }
        .save-btn { background-color: #17a2b8; }
        .clear-btn { background-color: #dc3545; }

        /* List Items (History & Contacts) */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
        }
        .list-item .name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }
        .list-item .number {
            font-size: 13px;
            color: #666;
        }
        .mini-call-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        input.input-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #0f4c81;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 2. Custom In-App Call Screen (Truecaller Style Overlay) */
        #active-call-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f4c81, #0b3960);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 100;
            text-align: center;
        }
        .caller-info h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .caller-info p {
            font-size: 18px;
            color: #ffcc00;
        }
        .call-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .end-call-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        
        <!-- TOP TABS -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('dialer')">Dialer</div>
            <div class="tab" onclick="switchTab('history')">History</div>
            <div class="tab" onclick="switchTab('contacts')">Contacts</div>
        </div>

        <!-- 1. DIALER SCREEN -->
        <div id="dialer-screen" class="screen active">
            <input type="text" id="display" readonly placeholder="Number...">
            <div class="keypad">
                <button class="key-btn" onclick="press('1')">1</button>
                <button class="key-btn" onclick="press('2')">2</button>
                <button class="key-btn" onclick="press('3')">3</button>
                <button class="key-btn" onclick="press('4')">4</button>
                <button class="key-btn" onclick="press('5')">5</button>
                <button class="key-btn" onclick="press('6')">6</button>
                <button class="key-btn" onclick="press('7')">7</button>
                <button class="key-btn" onclick="press('8')">8</button>
                <button class="key-btn" onclick="press('9')">9</button>
                <button class="key-btn" onclick="press('*')">*</button>
                <button class="key-btn" onclick="press('0')">0</button>
                <button class="key-btn" onclick="press('#')">#</button>
            </div>
            <div class="dialer-actions">
                <button class="action-btn clear-btn" onclick="clearNum()">C</button>
                <button class="action-btn save-btn" onclick="goToSaveContact()">Save</button>
                <button class="action-btn call-btn" onclick="startCall(document.getElementById('display').value)">📞 Call</button>
            </div>
        </div>

        <!-- 2. HISTORY SCREEN -->
        <div id="history-screen" class="screen">
            <h3 style="margin-bottom: 15px; color: #333;">Call History</h3>
            <div id="history-list"></div>
        </div>

        <!-- 3. CONTACTS SCREEN -->
        <div id="contacts-screen" class="screen">
            <h3 style="margin-bottom: 10px; color: #333;">Saved Contacts</h3>
            <div style="margin-bottom: 15px;">
                <input type="text" id="c-name" class="input-box" placeholder="Naam (Name)">
                <input type="text" id="c-num" class="input-box" placeholder="Phone Number">
                <button class="submit-btn" onclick="saveContact()">Contact Save Karein</button>
            </div>
            <hr style="border:0; border-top:1px solid #ddd; margin-bottom: 15px;">
            <div id="contacts-list"></div>
        </div>

        <!-- TRUECALLER STYLE CUSTOM CALL SCREEN OVERLAY -->
        <div id="active-call-screen">
            <div style="margin-top: 30px;">
                <p style="font-size: 14px; letter-spacing: 1px; color: #ddd;">TRUE-WEB CALLING...</p>
            </div>
            <div class="caller-info">
                <h2 id="calling-name-display">Unknown</h2>
                <p id="calling-num-display">0000000000</p>
                <span id="call-status-text" style="font-size: 15px; color: #a5d6a7; display:block; margin-top:10px;">Connecting...</span>
            </div>
            <div class="call-controls">
                <button class="end-call-btn" onclick="endCall()" title="End Call">📞</button>
            </div>
        </div>

    </div>

    <script>
        // Tab Switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

            if (tabName === 'dialer') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('dialer-screen').classList.add('active');
            } else if (tabName === 'history') {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('history-screen').classList.add('active');
                loadHistory();
            } else if (tabName === 'contacts') {
                document.querySelectorAll('.tab')[2].classList.add('active');
                document.getElementById('contacts-screen').classList.add('active');
                loadContacts();
            }
        }

        // Dialer Logic
        function press(val) {
            document.getElementById('display').value += val;
        }
        function clearNum() {
            document.getElementById('display').value = '';
        }

        // Custom In-App Call Simulation (Truecaller style UI)
        function startCall(number) {
            if (!number) {
                alert("Kripya pehle number daalein!");
                return;
            }

            // Check if number matches any saved contact name
            let contacts = JSON.parse(localStorage.getItem('web_contacts')) || [];
            let found = contacts.find(c => c.number === number);
            let displayName = found ? found.name : "Unknown Number";

            // Show Custom Call Screen Overlay
            document.getElementById('calling-name-display').innerText = displayName;
            document.getElementById('calling-num-display').innerText = number;
            document.getElementById('call-status-text').innerText = "Ringing...";
            document.getElementById('active-call-screen').style.display = 'flex';

            // Simulate call connecting after 2 seconds
            setTimeout(() => {
                if (document.getElementById('active-call-screen').style.display === 'flex') {
                    document.getElementById('call-status-text').innerText = "Call Connected (0:01)";
                }
            }, 2000);

            // Save to History
            let history = JSON.parse(localStorage.getItem('web_history')) || [];
            let timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            history.unshift({ name: displayName, number: number, time: timeNow });
            localStorage.setItem('web_history', JSON.stringify(history));
        }

        function endCall() {
            document.getElementById('active-call-screen').style.display = 'none';
            document.getElementById('display').value = '';
        }

        // Contact Saving Logic
        function goToSaveContact() {
            let num = document.getElementById('display').value;
            if (!num) {
                alert("Pehle number type karein!");
                return;
            }
            switchTab('contacts');
            document.getElementById('c-num').value = num;
        }

        function saveContact() {
            let name = document.getElementById('c-name').value;
            let number = document.getElementById('c-num').value;

            if (!name || !number) {
                alert("Naam aur number dono bharein!");
                return;
            }

            let contacts = JSON.parse(localStorage.getItem('web_contacts')) || [];
            contacts.push({ name: name, number: number });
            localStorage.setItem('web_contacts', JSON.stringify(contacts));

            document.getElementById('c-name').value = '';
            document.getElementById('c-num').value = '';
            loadContacts();
            alert("Contact Safely Save Ho Gaya!");
        }

        function loadContacts() {
            let list = document.getElementById('contacts-list');
            list.innerHTML = '';
            let contacts = JSON.parse(localStorage.getItem('web_contacts')) || [];

            if (contacts.length === 0) {
                list.innerHTML = '<p style="color:#777; text-align:center; margin-top:20px;">Koi contact nahi hai.</p>';
                return;
            }

            contacts.forEach(c => {
                list.innerHTML += `
                    <div class="list-item">
                        <div>
                            <div class="name">${c.name}</div>
                            <div class="number">${c.number}</div>
                        </div>
                        <button class="mini-call-btn" onclick="startCall('${c.number}')">Call</button>
                    </div>
                `;
            });
        }

        function loadHistory() {
            let list = document.getElementById('history-list');
            list.innerHTML = '';
            let history = JSON.parse(localStorage.getItem('web_history')) || [];

            if (history.length === 0) {
                list.innerHTML = '<p style="color:#777; text-align:center; margin-top:20px;">Koi history nahi hai.</p>';
                return;
            }

            history.forEach(h => {
                list.innerHTML += `
                    <div class="list-item">
                        <div>
                            <div class="name">${h.name} (${h.number})</div>
                            <div class="number">Samay: ${h.time}</div>
                        </div>
                        <button class="mini-call-btn" onclick="startCall('${h.number}')">Call</button>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
