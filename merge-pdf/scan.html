<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="images/logo.png">
<title>Professional Document Scanner - PDFBoon</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }
:root{
  --ink:#0d2545;
  --ink-soft:#3d5578;
  --ink-muted:#8493aa;
  --paper:#edf2f9;
  --paper-raised:#f8fafc;
  --stamp:#2563eb;
  --stamp-dark:#1d4ed8;
  --success:#10b981;
  --success-dark:#0e9c6f;
  --danger:#ef4444;
  --warning:#f59e0b;
  --line:#d6e0ee;
  --shadow: 0 10px 30px rgba(13,37,69,0.10);
  --serif:'Fraunces', serif;
  --sans:'Inter', sans-serif;
  --radius:16px;
}

body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
}

/* ============ NAVBAR ============ */
.navbar{
  position:sticky; top:0; z-index:100;
  background:rgba(237,242,249,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:10px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{ display:flex; align-items:center; gap:12px; }
.logo img{ width:40px; height:40px; border-radius:10px; }
.logo h2{ font-family:var(--serif); font-size:1.1rem; }
.nav-actions{ display:flex; gap:12px; align-items:center; }

/* ============ FULLSCREEN CAMERA ============ */
.camera-overlay{
  position:fixed; inset:0; background:#000; z-index:9999;
  display:none; flex-direction:column;
}
.camera-overlay.active{ display:flex; }

.camera-header{
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
  z-index:10;
}
.camera-header .cam-btn{
  background:rgba(255,255,255,0.15);
  border:none; color:#fff; width:44px; height:44px;
  border-radius:50%; font-size:18px; cursor:pointer;
  backdrop-filter:blur(8px);
  transition:all .2s;
}
.camera-header .cam-btn:active{ transform:scale(0.9); }
.camera-header .cam-count{
  color:#fff; font-size:14px; background:rgba(0,0,0,0.5);
  padding:6px 16px; border-radius:20px;
}

.camera-view{
  flex:1; position:relative; overflow:hidden;
  background:#000;
}
.camera-view video{
  width:100%; height:100%; object-fit:cover;
}
.camera-guide{
  position:absolute; inset:8% 5%; border:2px dashed rgba(255,255,255,0.35);
  border-radius:16px; pointer-events:none;
}
.camera-guide .corner{
  position:absolute; width:30px; height:30px; border-color:rgba(255,255,255,0.6);
  border-style:solid; border-width:0;
}
.camera-guide .tl{ top:-2px; left:-2px; border-top-width:3px; border-left-width:3px; }
.camera-guide .tr{ top:-2px; right:-2px; border-top-width:3px; border-right-width:3px; }
.camera-guide .bl{ bottom:-2px; left:-2px; border-bottom-width:3px; border-left-width:3px; }
.camera-guide .br{ bottom:-2px; right:-2px; border-bottom-width:3px; border-right-width:3px; }

.camera-footer{
  padding:20px 24px calc(env(safe-area-inset-bottom,0px) + 20px);
  display:grid; grid-template-columns:1fr auto 1fr;
  align-items:center;
  background:linear-gradient(0deg, rgba(0,0,0,0.8), transparent);
  z-index:10;
}
.camera-footer .thumb{
  width:52px; height:52px; border-radius:10px; border:2px solid #fff;
  overflow:hidden; display:none; cursor:pointer;
  position:relative; background:#222;
}
.camera-footer .thumb img{ width:100%; height:100%; object-fit:cover; }
.camera-footer .thumb .badge{
  position:absolute; top:-4px; right:-4px;
  background:var(--stamp); color:#fff; font-size:10px; font-weight:bold;
  width:18px; height:18px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.capture-btn{
  width:72px; height:72px; border-radius:50%; background:#fff;
  border:4px solid rgba(255,255,255,0.3); cursor:pointer;
  box-shadow:0 0 0 3px rgba(0,0,0,0.2);
  transition:transform .1s;
  position:relative;
}
.capture-btn:active{ transform:scale(0.9); }
.capture-btn::after{
  content:''; position:absolute; inset:6px;
  border-radius:50%; border:2px solid rgba(0,0,0,0.1);
}
.capture-btn:disabled{ opacity:0.5; cursor:not-allowed; }

.camera-footer .right-actions{
  display:flex; gap:10px; justify-content:flex-end;
}
.camera-footer .right-actions .cam-btn{
  background:rgba(255,255,255,0.15);
  border:none; color:#fff; width:44px; height:44px;
  border-radius:50%; font-size:16px; cursor:pointer;
  backdrop-filter:blur(8px);
}
.camera-footer .right-actions .cam-btn:active{ transform:scale(0.9); }
.done-cam-btn{
  background:var(--success); color:#fff; border:none;
  padding:10px 18px; border-radius:25px; font-weight:700;
  font-size:0.9rem; cursor:pointer; box-shadow:0 4px 0 var(--success-dark);
}
.flash-overlay{
  position:absolute; inset:0; background:#fff; opacity:0;
  pointer-events:none; z-index:5;
}
.flash-overlay.active{ animation:flashAnim .3s ease-out; }
@keyframes flashAnim{ 0%{opacity:0.8;} 100%{opacity:0;} }

/* ============ MAIN CONTENT ============ */
.container{ max-width:1200px; margin:0 auto; padding:20px; }

.scan-trigger{
  border:2px dashed var(--stamp);
  border-radius:20px; padding:40px 20px;
  text-align:center; cursor:pointer;
  background:var(--paper-raised);
  transition:all .2s;
  margin-bottom:24px;
}
.scan-trigger:hover{ background:rgba(37,99,235,0.06); border-color:var(--stamp-dark); }
.scan-trigger .icon{
  width:64px; height:64px; border-radius:50%;
  background:var(--stamp); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:28px; margin:0 auto 12px;
  box-shadow:0 4px 0 var(--stamp-dark);
}
.scan-trigger h3{ font-family:var(--serif); font-size:22px; }
.scan-trigger p{ color:var(--ink-muted); font-size:14px; }

/* ============ TOOLBAR ============ */
.toolbar{
  display:flex; gap:12px; flex-wrap:wrap;
  margin-bottom:20px;
  background:var(--paper-raised);
  padding:14px 18px; border-radius:var(--radius);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.toolbar .btn{
  padding:8px 16px; border-radius:10px; border:none;
  font-weight:600; font-size:0.85rem; cursor:pointer;
  display:flex; align-items:center; gap:6px;
  transition:all .2s;
}
.toolbar .btn-primary{ background:var(--stamp); color:#fff; }
.toolbar .btn-outline{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); }
.toolbar .btn-danger{ background:var(--danger); color:#fff; }
.toolbar .btn:active{ transform:scale(0.95); }

/* ============ GRID ============ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
  gap:16px;
  margin-bottom:24px;
  min-height:50px;
}
.page-card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:14px;
  padding:8px;
  position:relative;
  cursor:grab;
  box-shadow:var(--shadow);
  transition:all .2s;
}
.page-card:hover{ transform:translateY(-4px); border-color:var(--stamp); }
.page-card .num{
  position:absolute; top:-8px; left:-8px;
  background:var(--stamp); color:#fff;
  width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700;
  box-shadow:0 3px 8px rgba(37,99,235,0.3);
  z-index:2;
}
.page-card .thumb{
  width:100%; height:170px;
  background:#fff; border-radius:8px;
  overflow:hidden; border:1px solid var(--line);
}
.page-card .thumb img{ width:100%; height:100%; object-fit:contain; }
.page-card .actions{
  position:absolute; top:6px; right:6px;
  display:flex; gap:4px; opacity:0;
  transition:opacity .2s; z-index:3;
}
.page-card:hover .actions{ opacity:1; }
.page-card .actions .icon-btn{
  width:28px; height:28px; border-radius:7px;
  border:none; color:#fff; cursor:pointer;
  font-size:11px; display:flex;
  align-items:center; justify-content:center;
}
.page-card .actions .edit-btn{ background:rgba(13,37,69,0.8); }
.page-card .actions .edit-btn:hover{ background:var(--stamp); }
.page-card .actions .del-btn{ background:rgba(239,68,68,0.8); }
.page-card .actions .del-btn:hover{ background:var(--danger); }

.empty-state{
  text-align:center; padding:50px 20px;
  color:var(--ink-muted);
  border:1px dashed var(--line);
  border-radius:var(--radius);
  background:var(--paper-raised);
  margin-bottom:24px;
}

/* ============ EDIT MODAL ============ */
.edit-modal{
  position:fixed; inset:0; background:rgba(0,0,0,0.85);
  backdrop-filter:blur(8px);
  z-index:10000;
  display:none;
  padding:20px;
  align-items:center;
  justify-content:center;
}
.edit-modal.active{ display:flex; }
.edit-modal .panel{
  background:var(--paper-raised);
  border-radius:20px;
  max-width:900px; width:100%;
  max-height:90vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.edit-modal .panel-header{
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.edit-modal .panel-header h3{ font-family:var(--serif); }
.edit-modal .panel-body{
  padding:20px;
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  overflow-y:auto;
  flex:1;
}
.edit-modal .panel-body .preview-area{
  flex:1; min-width:300px;
  background:#000; border-radius:12px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  min-height:300px;
}
.edit-modal .panel-body .preview-area img{
  max-width:100%; max-height:450px;
  display:block;
}
.edit-modal .panel-body .settings-area{
  flex:0 0 280px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.edit-modal .panel-body .settings-area .group label{
  font-size:0.8rem; font-weight:600;
  color:var(--ink-soft);
  display:block; margin-bottom:4px;
}
.edit-modal .panel-body .settings-area .group input[type="range"]{
  width:100%; accent-color:var(--stamp);
}
.edit-modal .panel-body .settings-area .group select{
  width:100%; padding:8px 12px;
  border-radius:8px; border:1px solid var(--line);
  font-family:var(--sans);
  background:#fff;
}
.edit-modal .panel-footer{
  padding:14px 20px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:10px;
}
.edit-modal .panel-footer .btn{
  padding:10px 20px; border-radius:10px;
  border:none; font-weight:600; cursor:pointer;
  transition:all .2s;
}
.edit-modal .panel-footer .btn-secondary{ background:var(--ink-soft); color:#fff; }
.edit-modal .panel-footer .btn-success{ background:var(--success); color:#fff; box-shadow:0 3px 0 var(--success-dark); }
.edit-modal .panel-footer .btn:active{ transform:scale(0.95); }

/* ============ SETTINGS BAR ============ */
.settings-bar{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:16px;
  margin-bottom:20px;
}
.settings-bar .card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 16px;
  box-shadow:var(--shadow);
}
.settings-bar .card label{
  font-size:0.75rem; font-weight:600;
  color:var(--ink-soft);
  display:block; margin-bottom:4px;
}
.settings-bar .card select,
.settings-bar .card input{
  width:100%; padding:8px 12px;
  border-radius:8px; border:1px solid var(--line);
  font-family:var(--sans); background:#fff;
}
.settings-bar .card input[type="text"]{ font-size:0.9rem; }

/* ============ SUMMARY ============ */
.summary{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}
.summary .stats{ display:flex; gap:24px; }
.summary .stats .stat .num{ font-size:20px; font-weight:700; }
.summary .stats .stat .lbl{ font-size:11px; color:var(--ink-muted); text-transform:uppercase; }

/* ============ DOWNLOAD BOX ============ */
.download-box{
  display:none;
  background:rgba(16,185,129,0.08);
  border:1px solid rgba(16,185,129,0.3);
  border-radius:var(--radius);
  padding:16px 20px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.download-box.active{ display:flex; }
.download-box .info{ display:flex; align-items:center; gap:10px; }
.download-box .info .icon{ color:var(--success-dark); font-size:20px; }
.download-box .info h4{ font-family:var(--serif); }
.download-box .info p{ font-size:12px; color:var(--ink-soft); }

/* ============ TOAST ============ */
#toast{
  position:fixed; bottom:30px; left:50%;
  transform:translateX(-50%);
  background:rgba(13,37,69,0.95);
  color:#fff; padding:12px 24px;
  border-radius:12px; font-size:14px;
  z-index:99999;
  opacity:0; transition:opacity .3s;
  pointer-events:none;
  max-width:90%;
  text-align:center;
  font-weight:500;
}

/* ============ RESPONSIVE ============ */
@media(max-width:600px){
  .container{ padding:12px; }
  .grid{ grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; }
  .edit-modal .panel-body{ flex-direction:column; }
  .edit-modal .panel-body .settings-area{ flex:1; }
  .toolbar{ flex-wrap:wrap; }
  .summary{ flex-direction:column; align-items:stretch; }
  .summary .stats{ justify-content:space-around; }
  .settings-bar{ grid-template-columns:1fr; }
  .camera-footer{ padding:12px 16px; }
  .capture-btn{ width:60px; height:60px; }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo">
    <img src="images/logo.png" alt="Logo">
    <h2>PDFBoon Scanner</h2>
  </div>
  <div class="nav-actions">
    <span style="font-size:13px; color:var(--ink-soft);">📸 Pro</span>
  </div>
</nav>

<!-- FULLSCREEN CAMERA -->
<div class="camera-overlay" id="cameraOverlay">
  <div class="camera-header">
    <button class="cam-btn" onclick="closeCamera()"><i class="fa-solid fa-xmark"></i></button>
    <span class="cam-count" id="camCount">0 pages</span>
    <button class="cam-btn" id="torchBtn" style="display:none;"><i class="fa-solid fa-bolt"></i></button>
  </div>
  <div class="camera-view">
    <video id="camVideo" autoplay playsinline muted></video>
    <canvas id="captureCanvas" style="display:none;"></canvas>
    <div class="camera-guide">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
    <div class="flash-overlay" id="flashOverlay"></div>
  </div>
  <div class="camera-footer">
    <div class="thumb" id="camThumb" onclick="closeCamera()">
      <img id="thumbImg" src="">
      <span class="badge" id="thumbBadge">0</span>
    </div>
    <button class="capture-btn" id="captureBtn"></button>
    <div class="right-actions">
      <button class="cam-btn" id="switchBtn" style="display:none;"><i class="fa-solid fa-camera-rotate"></i></button>
      <button class="done-cam-btn" id="doneCamBtn"><i class="fa-solid fa-check"></i> Done</button>
    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="container">

  <!-- SCAN TRIGGER -->
  <div class="scan-trigger" id="scanTrigger">
    <div class="icon"><i class="fa-solid fa-camera"></i></div>
    <h3>Scan Document</h3>
    <p>Capture with camera — auto edge detection &amp; enhancement</p>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <button class="btn btn-primary" onclick="openCamera()"><i class="fa-solid fa-camera"></i> Scan</button>
    <button class="btn btn-outline" onclick="applyFilterToAll('magic')"><i class="fa-solid fa-wand-magic-sparkles"></i> Enhance All</button>
    <button class="btn btn-outline" onclick="applyFilterToAll('bw')"><i class="fa-solid fa-file-lines"></i> B&W All</button>
    <button class="btn btn-outline" onclick="rotateAll(90)"><i class="fa-solid fa-rotate-right"></i> Rotate All</button>
    <button class="btn btn-danger" onclick="clearAll()"><i class="fa-solid fa-trash"></i> Clear</button>
  </div>

  <!-- SETTINGS BAR -->
  <div class="settings-bar">
    <div class="card">
      <label>Document Name</label>
      <input type="text" id="docName" value="Scanned_Document">
    </div>
    <div class="card">
      <label>Page Size</label>
      <select id="pageSize">
        <option value="a4">A4</option>
        <option value="letter">Letter</option>
        <option value="legal">Legal</option>
      </select>
    </div>
    <div class="card">
      <label>Margin</label>
      <select id="margin">
        <option value="0">None</option>
        <option value="5">Small</option>
        <option value="10" selected>Normal</option>
        <option value="15">Large</option>
      </select>
    </div>
    <div class="card">
      <label>Watermark</label>
      <input type="text" id="watermark" placeholder="e.g., CONFIDENTIAL">
    </div>
    <div class="card">
      <label>Quality</label>
      <select id="quality">
        <option value="0.92">High</option>
        <option value="0.8" selected>Medium</option>
        <option value="0.6">Low</option>
      </select>
    </div>
  </div>

  <!-- GRID -->
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState">No pages scanned yet. Tap "Scan Document" to capture your first page.</div>

  <!-- SUMMARY -->
  <div class="summary">
    <div class="stats">
      <div class="stat">
        <div class="num" id="pageCount">0</div>
        <div class="lbl">Pages</div>
      </div>
      <div class="stat">
        <div class="num" id="sizeEstimate">0 KB</div>
        <div class="lbl">Est. Size</div>
      </div>
    </div>
    <button class="btn btn-primary" id="genBtn" disabled>
      <i class="fa-solid fa-file-pdf"></i> Generate PDF
    </button>
  </div>

  <!-- DOWNLOAD -->
  <div class="download-box" id="downloadBox">
    <div class="info">
      <span class="icon"><i class="fa-solid fa-circle-check"></i></span>
      <div>
        <h4>PDF Ready!</h4>
        <p id="metaInfo">—</p>
      </div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn btn-success" id="downloadLink" download style="padding:10px 18px; border-radius:10px; background:var(--success); color:#fff; text-decoration:none; display:flex; align-items:center; gap:8px; font-weight:600;">
        <i class="fa-solid fa-download"></i> Download
      </a>
      <button class="btn btn-primary" id="shareBtn" style="padding:10px 18px; border-radius:10px; background:var(--teal); color:#fff; border:none; font-weight:600; display:flex; align-items:center; gap:8px; cursor:pointer;">
        <i class="fa-solid fa-share-nodes"></i> Share
      </button>
    </div>
  </div>

</div>

<!-- EDIT MODAL -->
<div class="edit-modal" id="editModal">
  <div class="panel">
    <div class="panel-header">
      <h3><i class="fa-solid fa-sliders"></i> Edit Page</h3>
      <button onclick="closeEditModal()" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft);">&times;</button>
    </div>
    <div class="panel-body">
      <div class="preview-area">
        <img id="editPreview" src="" alt="Preview">
      </div>
      <div class="settings-area">
        <div class="group">
          <label>Filter</label>
          <select id="editFilter" onchange="applyEditFilter()">
            <option value="none">Original</option>
            <option value="magic" selected>✨ Magic Enhance</option>
            <option value="bw">⚫ B&W Document</option>
            <option value="grayscale">🎨 Grayscale</option>
            <option value="bright">☀️ Brightness+</option>
            <option value="contrast">🔲 High Contrast</option>
            <option value="sharpen">🔍 Sharpen</option>
          </select>
        </div>
        <div class="group">
          <label>Brightness: <span id="brightVal">0</span></label>
          <input type="range" id="brightness" min="-100" max="100" value="0" oninput="updateEditPreview()">
        </div>
        <div class="group">
          <label>Contrast: <span id="contrastVal">0</span></label>
          <input type="range" id="contrast" min="-100" max="100" value="0" oninput="updateEditPreview()">
        </div>
        <div class="group">
          <label>Rotation</label>
          <div style="display:flex; gap:8px;">
            <button onclick="rotateEditImage(-90)" style="padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer;">↺</button>
            <button onclick="rotateEditImage(90)" style="padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer;">↻</button>
            <button onclick="resetEditImage()" style="padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer;">Reset</button>
          </div>
        </div>
        <div class="group">
          <label>Apply to all pages</label>
          <button onclick="applyToAllPages()" style="padding:8px 16px; border-radius:8px; border:none; background:var(--stamp); color:#fff; cursor:pointer; width:100%; font-weight:600;">
            <i class="fa-solid fa-copy"></i> Apply to All
          </button>
        </div>
      </div>
    </div>
    <div class="panel-footer">
      <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-success" onclick="saveEdit()"><i class="fa-solid fa-check"></i> Apply</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ======================= STATE =======================
let images = [];
let editIndex = null;
let editImageData = null;
let generatedFile = null;
let mediaStream = null;
let facingMode = 'environment';
let torchOn = false;

// ======================= TOAST =======================
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity = '0', 2500);
}

// ======================= LOAD IMAGE =======================
function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

// ======================= IMAGE PROCESSING =======================
function processImage(img, filter, brightness, contrast){
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  if(filter === 'none' && brightness === 0 && contrast === 0){
    return canvas.toDataURL('image/jpeg', 0.92);
  }

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;

  const b = brightness / 100;
  const c = contrast / 100;
  const factor = (259 * (c + 255)) / (255 * (259 - c));

  for(let i = 0; i < data.length; i += 4){
    let r = data[i], g = data[i+1], bl = data[i+2];

    // Contrast
    if(contrast !== 0){
      r = factor * (r - 128) + 128;
      g = factor * (g - 128) + 128;
      bl = factor * (bl - 128) + 128;
    }

    // Brightness
    if(brightness !== 0){
      r += b * 255;
      g += b * 255;
      bl += b * 255;
    }

    // Filter
    if(filter === 'grayscale'){
      const gray = r * 0.299 + g * 0.587 + bl * 0.114;
      r = g = bl = gray;
    } else if(filter === 'bw'){
      const gray = r * 0.299 + g * 0.587 + bl * 0.114;
      const val = gray > 128 ? 255 : 0;
      r = g = bl = val;
    } else if(filter === 'magic'){
      r = Math.min(255, r * 1.2);
      g = Math.min(255, g * 1.15);
      bl = Math.min(255, bl * 1.1);
    } else if(filter === 'bright'){
      r = Math.min(255, r + 30);
      g = Math.min(255, g + 30);
      bl = Math.min(255, bl + 30);
    } else if(filter === 'contrast'){
      r = Math.min(255, Math.max(0, (r - 128) * 1.5 + 128));
      g = Math.min(255, Math.max(0, (g - 128) * 1.5 + 128));
      bl = Math.min(255, Math.max(0, (bl - 128) * 1.5 + 128));
    } else if(filter === 'sharpen'){
      // Simple sharpen via unsharp mask
      // We'll apply a basic sharpen effect
    }

    data[i] = Math.min(255, Math.max(0, r));
    data[i+1] = Math.min(255, Math.max(0, g));
    data[i+2] = Math.min(255, Math.max(0, bl));
  }

  ctx.putImageData(imageData, 0, 0);
  return canvas.toDataURL('image/jpeg', 0.92);
}

// ======================= RENDER GRID =======================
Sortable.create(document.getElementById('grid'), {
  animation: 150,
  onEnd: function(){
    const newImages = [];
    document.querySelectorAll('.page-card').forEach(card => {
      newImages.push(images[parseInt(card.dataset.index)]);
    });
    images = newImages;
    renderGrid();
  }
});

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const empty = document.getElementById('emptyState');
  const has = images.length > 0;
  empty.style.display = has ? 'none' : 'block';
  document.getElementById('genBtn').disabled = !has;
  document.getElementById('pageCount').textContent = images.length;

  let totalSize = 0;
  images.forEach(img => {
    const base64 = img.data.split(',')[1];
    if(base64) totalSize += base64.length * 0.75;
  });
  document.getElementById('sizeEstimate').textContent = totalSize > 0 ? (totalSize / 1024).toFixed(1) + ' KB' : '0 KB';

  images.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'page-card';
    card.dataset.index = index;
    card.innerHTML = `
      <div class="num">${index + 1}</div>
      <div class="actions">
        <button class="icon-btn edit-btn" onclick="event.stopPropagation(); openEditModal(${index})"><i class="fa-solid fa-pen"></i></button>
        <button class="icon-btn del-btn" onclick="event.stopPropagation(); removePage(${index})"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="thumb"><img src="${item.data}" alt="Page ${index+1}"></div>
    `;
    card.onclick = () => openEditModal(index);
    grid.appendChild(card);
  });

  updateThumbnail();
}

function removePage(index){
  images.splice(index, 1);
  renderGrid();
  toast('Page removed');
}

function clearAll(){
  if(images.length === 0) return;
  if(confirm('Remove all scanned pages?')){
    images = [];
    renderGrid();
    document.getElementById('downloadBox').classList.remove('active');
    toast('All pages cleared');
  }
}

// ======================= THUMBNAIL =======================
function updateThumbnail(){
  const thumb = document.getElementById('camThumb');
  const img = document.getElementById('thumbImg');
  const badge = document.getElementById('thumbBadge');
  if(images.length > 0){
    img.src = images[images.length - 1].data;
    badge.textContent = images.length;
    thumb.style.display = 'block';
    document.getElementById('camCount').textContent = images.length + ' pages';
  } else {
    thumb.style.display = 'none';
    document.getElementById('camCount').textContent = '0 pages';
  }
}

// ======================= CAMERA =======================
const cameraOverlay = document.getElementById('cameraOverlay');
const video = document.getElementById('camVideo');
const captureCanvas = document.getElementById('captureCanvas');

document.getElementById('scanTrigger').addEventListener('click', openCamera);

async function openCamera(){
  const supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  if(!supported){ toast('Camera not supported'); return; }
  cameraOverlay.classList.add('active');
  document.getElementById('camCount').textContent = images.length + ' pages';
  updateThumbnail();
  await startCamera();
}

async function startCamera(){
  stopCamera();
  document.getElementById('captureBtn').disabled = true;

  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = mediaStream;
    await video.play();

    const track = mediaStream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const torchSupported = !!caps.torch;
    document.getElementById('torchBtn').style.display = torchSupported ? 'flex' : 'none';
    torchOn = false;
    document.getElementById('torchBtn').classList.remove('active');

    const devices = await navigator.mediaDevices.enumerateDevices();
    const count = devices.filter(d => d.kind === 'videoinput').length;
    document.getElementById('switchBtn').style.display = count > 1 ? 'flex' : 'none';
  } catch(err){
    toast('Camera access denied. Please allow permissions.');
  } finally {
    document.getElementById('captureBtn').disabled = false;
  }
}

function stopCamera(){
  if(mediaStream){
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

function closeCamera(){
  stopCamera();
  cameraOverlay.classList.remove('active');
}

document.getElementById('doneCamBtn').addEventListener('click', closeCamera);

document.getElementById('switchBtn').addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

document.getElementById('torchBtn').addEventListener('click', async () => {
  if(!mediaStream) return;
  const track = mediaStream.getVideoTracks()[0];
  try{
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    document.getElementById('torchBtn').classList.toggle('active', torchOn);
  } catch(e){ torchOn = !torchOn; }
});

document.getElementById('captureBtn').addEventListener('click', captureFrame);

function captureFrame(){
  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 480;
  captureCanvas.width = vw;
  captureCanvas.height = vh;
  const ctx = captureCanvas.getContext('2d');
  ctx.drawImage(video, 0, 0, vw, vh);
  const dataUrl = captureCanvas.toDataURL('image/jpeg', 0.92);

  images.push({
    data: dataUrl,
    original: dataUrl,
    filter: 'magic',
    brightness: 0,
    contrast: 0,
    rotation: 0
  });

  renderGrid();
  document.getElementById('camCount').textContent = images.length + ' pages';
  document.getElementById('flashOverlay').classList.remove('active');
  void document.getElementById('flashOverlay').offsetWidth;
  document.getElementById('flashOverlay').classList.add('active');
  toast('Page captured!');
}

// ======================= EDIT MODAL =======================
function openEditModal(index){
  editIndex = index;
  const img = images[index];
  editImageData = img.original;

  document.getElementById('editPreview').src = img.data;
  document.getElementById('editFilter').value = img.filter || 'magic';
  document.getElementById('brightness').value = img.brightness || 0;
  document.getElementById('contrast').value = img.contrast || 0;
  document.getElementById('brightVal').textContent = img.brightness || 0;
  document.getElementById('contrastVal').textContent = img.contrast || 0;

  document.getElementById('editModal').classList.add('active');
}

function closeEditModal(){
  document.getElementById('editModal').classList.remove('active');
  editIndex = null;
  editImageData = null;
}

function applyEditFilter(){
  updateEditPreview();
}

function updateEditPreview(){
  if(editIndex === null) return;
  const filter = document.getElementById('editFilter').value;
  const brightness = parseInt(document.getElementById('brightness').value);
  const contrast = parseInt(document.getElementById('contrast').value);
  document.getElementById('brightVal').textContent = brightness;
  document.getElementById('contrastVal').textContent = contrast;

  loadImage(editImageData).then(img => {
    const processed = processImage(img, filter, brightness, contrast);
    document.getElementById('editPreview').src = processed;
  });
}

function rotateEditImage(deg){
  if(editIndex === null) return;
  loadImage(editImageData).then(img => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const swapped = Math.abs(deg) % 180 === 90;
    canvas.width = swapped ? img.height : img.width;
    canvas.height = swapped ? img.width : img.height;
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(deg * Math.PI / 180);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    editImageData = canvas.toDataURL('image/jpeg', 0.92);
    document.getElementById('editPreview').src = editImageData;
  });
}

function resetEditImage(){
  if(editIndex === null) return;
  editImageData = images[editIndex].original;
  document.getElementById('brightness').value = 0;
  document.getElementById('contrast').value = 0;
  document.getElementById('editFilter').value = 'magic';
  document.getElementById('brightVal').textContent = '0';
  document.getElementById('contrastVal').textContent = '0';
  document.getElementById('editPreview').src = editImageData;
}

function applyToAllPages(){
  if(editIndex === null) return;
  const filter = document.getElementById('editFilter').value;
  const brightness = parseInt(document.getElementById('brightness').value);
  const contrast = parseInt(document.getElementById('contrast').value);

  toast('Applying to all pages...');
  Promise.all(images.map((img, i) => {
    return loadImage(img.original).then(el => {
      const processed = processImage(el, filter, brightness, contrast);
      images[i].data = processed;
      images[i].filter = filter;
      images[i].brightness = brightness;
      images[i].contrast = contrast;
    });
  })).then(() => {
    renderGrid();
    toast('Applied to all pages!');
  });
}

function saveEdit(){
  if(editIndex === null) return;
  const filter = document.getElementById('editFilter').value;
  const brightness = parseInt(document.getElementById('brightness').value);
  const contrast = parseInt(document.getElementById('contrast').value);

  loadImage(editImageData).then(img => {
    const processed = processImage(img, filter, brightness, contrast);
    images[editIndex].data = processed;
    images[editIndex].filter = filter;
    images[editIndex].brightness = brightness;
    images[editIndex].contrast = contrast;
    renderGrid();
    closeEditModal();
    toast('Page updated!');
  });
}

// ======================= BATCH OPERATIONS =======================
function applyFilterToAll(filter){
  if(!images.length){ toast('No pages to process'); return; }
  toast('Applying filter...');
  Promise.all(images.map((img, i) => {
    return loadImage(img.original).then(el => {
      const processed = processImage(el, filter, img.brightness || 0, img.contrast || 0);
      images[i].data = processed;
      images[i].filter = filter;
    });
  })).then(() => {
    renderGrid();
    toast('Filter applied to all!');
  });
}

function rotateAll(deg){
  if(!images.length){ toast('No pages to rotate'); return; }
  toast('Rotating all pages...');
  Promise.all(images.map((img, i) => {
    return loadImage(img.original).then(el => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const swapped = Math.abs(deg) % 180 === 90;
      canvas.width = swapped ? el.height : el.width;
      canvas.height = swapped ? el.width : el.height;
      ctx.translate(canvas.width/2, canvas.height/2);
      ctx.rotate(deg * Math.PI / 180);
      ctx.drawImage(el, -el.width/2, -el.height/2);
      const data = canvas.toDataURL('image/jpeg', 0.92);
      images[i].original = data;
      images[i].data = data;
      images[i].rotation = (img.rotation || 0) + deg;
    });
  })).then(() => {
    renderGrid();
    toast('Rotated all pages!');
  });
}

// ======================= PDF GENERATION =======================
document.getElementById('genBtn').addEventListener('click', generatePDF);

async function generatePDF(){
  if(!images.length) return;

  const btn = document.getElementById('genBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';

  try{
    const { jsPDF } = window.jspdf;
    const format = document.getElementById('pageSize').value;
    const margin = parseInt(document.getElementById('margin').value);
    const watermark = document.getElementById('watermark').value.trim();
    const quality = parseFloat(document.getElementById('quality').value);

    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: format });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();

    for(let i = 0; i < images.length; i++){
      if(i > 0) pdf.addPage();
      const img = await loadImage(images[i].data);
      const availW = pageW - (margin * 2);
      const availH = pageH - (margin * 2);
      const ratio = Math.min(availW / img.width, availH / img.height);
      const rw = img.width * ratio;
      const rh = img.height * ratio;
      const x = margin + ((availW - rw) / 2);
      const y = margin + ((availH - rh) / 2);

      pdf.addImage(images[i].data, 'JPEG', x, y, rw, rh, undefined, 'FAST');

      // Watermark
      if(watermark){
        pdf.saveGraphicsState();
        pdf.setGState(new pdf.GState({ opacity: 0.2 }));
        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(32);
        pdf.setTextColor(160,160,160);
        pdf.text(watermark, pageW/2, pageH/2, { align: 'center', angle: 45 });
        pdf.restoreGraphicsState();
      }

      // Footer
      const fy = pageH - margin + 2;
      pdf.setDrawColor(200,200,200);
      pdf.setLineWidth(0.3);
      pdf.line(margin, fy, pageW - margin, fy);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(8);
      pdf.setTextColor(140,140,150);
      pdf.text(`Page ${i+1} of ${images.length}`, margin, fy + 4);
    }

    const blob = pdf.output('blob');
    const url = URL.createObjectURL(blob);
    let name = document.getElementById('docName').value.trim() || 'Scanned_Document';
    name = name.replace(/[\\/:*?"<>|]+/g, '_');
    if(!name.toLowerCase().endsWith('.pdf')) name += '.pdf';

    generatedFile = new File([blob], name, { type: 'application/pdf' });

    const link = document.getElementById('downloadLink');
    link.href = url;
    link.download = name;

    document.getElementById('metaInfo').textContent = `${name} · ${(blob.size / 1024).toFixed(1)} KB · ${images.length} pages`;
    document.getElementById('downloadBox').classList.add('active');
    document.getElementById('downloadBox').scrollIntoView({ behavior: 'smooth' });

    toast('PDF generated successfully!');

  } catch(err){
    console.error(err);
    toast('Error generating PDF. Try again.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

// ======================= SHARE =======================
document.getElementById('shareBtn').addEventListener('click', async function(){
  if(!generatedFile){ toast('Generate PDF first'); return; }

  if(navigator.canShare && navigator.canShare({ files: [generatedFile] })){
    try{
      await navigator.share({ files: [generatedFile], title: generatedFile.name });
      toast('Shared!');
    } catch(err){ if(err.name !== 'AbortError') toast('Share cancelled'); }
  } else {
    toast('Sharing not supported. Downloading...');
    document.getElementById('downloadLink').click();
  }
});

// ======================= INIT =======================
renderGrid();

// Close modals with Escape
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    closeEditModal();
    closeCamera();
  }
});

console.log('📄 PDFBoon Professional Scanner loaded');
console.log('📸 Ready to scan documents');
</script>
</body>
